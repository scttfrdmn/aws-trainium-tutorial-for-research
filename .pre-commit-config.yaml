repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-ast
      - id: debug-statements

  # Ruff replaces black, isort, flake8, flake8-docstrings, and pydocstyle.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6  # keep in sync with the ruff==0.16.6 pin in pyproject.toml / requirements.txt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0  # matches the mypy version in uv.lock
    hooks:
      - id: mypy
        # Same scope as CI (`mypy scripts/`). examples/, advanced/, validation/ and tests/ are
        # not type-checked; running --strict over them would fail on every commit. scripts/
        # passes --strict; per-module overrides (e.g. cost_monitor, #36) come from pyproject.toml.
        files: ^scripts/
        args: [--ignore-missing-imports, --strict]
        additional_dependencies: [types-requests, types-PyYAML]

  # Custom hooks for testing
  # (Docstring coverage is now enforced by ruff's pydocstyle "D" rules — see pyproject.toml.)
  - repo: local
    hooks:
      # Same selection as CI. No coverage gate here: coverage is informational (`make coverage`).
      - id: pytest
        name: Run tests (no AWS / no Neuron hardware)
        # uv (the repo's supported workflow) resolves the project venv; a bare `python` entry
        # picks up whatever interpreter pre-commit runs under, which usually lacks pytest.
        entry: uv run --extra dev pytest
        language: system
        args: [-m, "not aws and not neuron", --tb=short]
        pass_filenames: false
        always_run: true
